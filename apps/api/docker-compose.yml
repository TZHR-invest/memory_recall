name: memory_recall

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=memory_recall
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - LLM_PROVIDER=${LLM_PROVIDER:-volcengine}
      - VOLC_API_KEY=${VOLC_API_KEY}
      - VOLC_API_BASE=${VOLC_API_BASE:-https://ark.cn-beijing.volces.com/api/v3}
      - VOLC_LLM_MODEL=${VOLC_LLM_MODEL:-doubao-seed-2-0-mini-260215}
      - VOLC_EMBEDDING_MODEL=${VOLC_EMBEDDING_MODEL:-doubao-embedding-vision-251215}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      - DEEPSEEK_LLM_MODEL=${DEEPSEEK_LLM_MODEL:-deepseek-v4-flash}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app/
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=memory_recall
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  adminer:
    image: adminer
    container_name: memory_recall_adminer
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: python:3-slim
    container_name: memory_recall-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../../web:/srv/web:ro
    command: python3 -m http.server 3000 --directory /srv/web

volumes:
  postgres_data:

