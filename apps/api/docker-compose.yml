services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=memory_recall
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - VOLC_API_KEY=${VOLC_API_KEY}
      - VOLC_API_BASE=${VOLC_API_BASE:-https://ark.cn-beijing.volces.com/api/v3}
      - VOLC_LLM_MODEL=${VOLC_LLM_MODEL:-doubao-seed-2-0-mini-260215}
      - VOLC_EMBEDDING_MODEL=${VOLC_EMBEDDING_MODEL:-doubao-embedding-vision-251215}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app/
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=memory_recall
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
# ==================== 新增的 pgAdmin 服务 ====================
  pgadmin:
    image: dpage/pgadmin4:latest          # 官方最新镜像
    container_name: memory_recall_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"                         # 浏览器访问端口，可改成其他（如 8080:80）
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com      # 登录用户名（邮箱格式）
      PGADMIN_DEFAULT_PASSWORD: admin123          # 登录密码（建议修改成强密码）
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:

