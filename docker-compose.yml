version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: memory_recall_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memory_recall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  api:
    build: .
    container_name: memory_recall_api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/memory_recall
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./:/app
    restart: unless-stopped

volumes:
  postgres_data:
