# memory_recall 配置文件

# 数据库配置
database:
  type: postgresql  # postgresql / sqlite
  host: localhost
  port: 5432
  name: memory_recall
  user: postgres
  password: postgres

# 向量模型配置
embedding:
  provider: bailian  # openai / bailian / local
  model: doubao-embedding-vision-251215
  dimension: 768
  batch_size: 32

# LLM 配置
llm:
  provider: bailian  # openai / bailian
  model: doubao-seed-2-0-pro-260215
  temperature: 0.3
  max_tokens: 2000

# 召回配置
recall:
  weights:
    time: 0.3
    keyword: 0.3
    semantic: 0.3
    frequency: 0.1
  default_limit: 10
  max_limit: 100

# API 配置
api:
  host: 0.0.0.0
  port: 8000
  debug: true

# 日志配置
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
